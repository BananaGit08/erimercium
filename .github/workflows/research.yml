name: Deep dive research

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker to research (blank = show what is due)"
        type: string
        default: ""
      dossier_only:
        description: "Gather data only, skip the written report (no API key needed)"
        type: boolean
        default: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Research
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TICKER: ${{ inputs.ticker }}
          DOSSIER_ONLY: ${{ inputs.dossier_only }}
        run: |
          args=()
          if [ -n "$TICKER" ]; then
            args+=(--ticker "$TICKER")
            [ "$DOSSIER_ONLY" = "true" ] && args+=(--dossier-only)
          else
            args+=(--due)
          fi
          python -m watchlist_agent.deep_dive "${args[@]}"
