name: Deep dive research

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker to research (blank = show what is due)"
        type: string
        default: ""
      dossier_only:
        description: "Gather data only, skip the written report (no API key needed)"
        type: boolean
        default: true
      run_due:
        description: "Generate and email everything due today"
        type: boolean
        default: false
      baseline_limit:
        description: "Max first-time reports per run"
        type: string
        default: "3"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Research
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ vars.DIGEST_RECIPIENT || 'christian.na@icloud.com' }}
          TICKER: ${{ inputs.ticker }}
          DOSSIER_ONLY: ${{ inputs.dossier_only }}
          RUN_DUE: ${{ inputs.run_due }}
          BASELINE_LIMIT: ${{ inputs.baseline_limit }}
        run: |
          args=()
          if [ "$RUN_DUE" = "true" ]; then
            args+=(--run --baseline-limit "${BASELINE_LIMIT:-3}")
            if [ "$DOSSIER_ONLY" = "true" ]; then
              args+=(--dossier-only)
            fi
          elif [ -n "$TICKER" ]; then
            args+=(--ticker "$TICKER")
            if [ "$DOSSIER_ONLY" = "true" ]; then
              args+=(--dossier-only)
            fi
          else
            args+=(--due)
          fi
          python -m watchlist_agent.deep_dive "${args[@]}"

      - name: Record what was sent
        # always(): the first batch was cancelled on timeout after emailing four
        # reports, and this step was skipped -- so the next run would have sent
        # them again. Whatever was delivered must be recorded even when the job
        # does not finish cleanly.
        if: ${{ always() && inputs.run_due == true && inputs.dossier_only != true }}
        run: |
          if git diff --quiet -- reports_sent.json; then
            echo "no new reports recorded"
            exit 0
          fi
          git config user.name "erimercium-agent"
          git config user.email "christian@banananorth.com"
          git add reports_sent.json
          git commit -m "Record research reports sent on $(date -u +%Y-%m-%d)"
          git push
