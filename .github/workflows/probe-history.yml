name: Probe history sources

# Diagnostic only. The sandbox where this code is written has no outbound
# network, so reachability of third-party data sources has to be checked here.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers to inspect in detail (blank = source reachability probe)"
        type: string
        default: ""
      transcripts:
        description: "Probe earnings transcript sources and the surprise endpoint instead"
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          TICKERS: ${{ inputs.tickers }}
          TRANSCRIPTS: ${{ inputs.transcripts }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Optional. Absent, the transcript probe reports what a key would be
          # needed for rather than pretending the source was tested.
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ "$TRANSCRIPTS" = "true" ]; then
            python tools/probe_transcripts.py $TICKERS
          elif [ -n "$TICKERS" ]; then
            python tools/probe_ticker.py $TICKERS
          else
            python tools/probe_history.py
          fi
